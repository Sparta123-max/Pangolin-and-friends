<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Ký - Ranger Monitor AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:           #030a04;
    --surface:      rgba(10, 28, 13, 0.92);
    --text:         #edf7ee;
    --text-muted:   rgba(200, 230, 205, 0.65);
    --green-300:    #81c784;
    --green-500:    #4caf50;
    --green-700:    #2e7d32;
    --green-900:    #1b5e20;
    --teal:         #26c6da;
    --border:       rgba(129, 199, 132, 0.18);
    --border-focus: rgba(165, 214, 167, 0.55);
    --glow:         rgba(129, 199, 132, 0.22);
    --danger:       #ef5350;
    --radius:       14px;
    --transition:   0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Ambient nature background ── */
  .nature-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 15% 10%,  rgba(46,125,50,0.24) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 15%,  rgba(27,94,32,0.30) 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 50% 95%,  rgba(13,51,21,0.34) 0%, transparent 65%),
      linear-gradient(180deg, #061608 0%, #030a04 100%);
  }
  .nature-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(129,199,132,0.05) 1px, transparent 1px);
    background-size: 36px 36px;
  }

  /* ── Floating leaf particles ── */
  .leaves { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .leaf {
    position: absolute;
    width: 6px; height: 10px;
    border-radius: 50% 0 50% 0;
    background: rgba(129,199,132,0.18);
    animation: leafFall linear infinite;
    top: -20px;
  }
  .leaf:nth-child(1)  { left:  8%; width:5px; height:9px;  animation-duration:14s; animation-delay:0s;    opacity:0.6; }
  .leaf:nth-child(2)  { left: 22%; width:7px; height:12px; animation-duration:19s; animation-delay:3s;    opacity:0.4; }
  .leaf:nth-child(3)  { left: 38%; width:4px; height:8px;  animation-duration:16s; animation-delay:7s;    opacity:0.5; }
  .leaf:nth-child(4)  { left: 55%; width:6px; height:10px; animation-duration:21s; animation-delay:1s;    opacity:0.35;}
  .leaf:nth-child(5)  { left: 70%; width:5px; height:9px;  animation-duration:13s; animation-delay:9s;    opacity:0.55;}
  .leaf:nth-child(6)  { left: 85%; width:8px; height:13px; animation-duration:18s; animation-delay:5s;    opacity:0.3; }
  .leaf:nth-child(7)  { left: 93%; width:4px; height:7px;  animation-duration:15s; animation-delay:11s;   opacity:0.5; }

  @keyframes leafFall {
    0%   { transform: translateY(-20px) rotate(0deg)   translateX(0);   opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(110vh) rotate(540deg) translateX(40px); opacity: 0; }
  }

  /* ── Card ── */
  .card {
    position: relative;
    z-index: 1;
    width: 420px;
    max-width: calc(100vw - 32px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 44px 40px 36px;
    box-shadow:
      0 0 0 1px rgba(129,199,132,0.08),
      0 24px 64px rgba(0,0,0,0.6),
      0 0 80px rgba(46,125,50,0.10) inset;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  /* ── Brand mark ── */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .brand-emblem {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(46,125,50,0.70), rgba(27,94,32,0.90));
    border: 1px solid rgba(129,199,132,0.30);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(129,199,132,0.18);
    font-size: 26px;
    line-height: 1;
  }
  .brand-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
    text-align: center;
  }
  .brand-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    text-align: center;
    margin-top: -6px;
  }

  /* ── Divider ── */
  .divider {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(129,199,132,0.4), transparent);
    margin: 0 auto 28px;
  }

  /* ── Form ── */
  .field {
    margin-bottom: 14px;
    position: relative;
  }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
  }
  .field input::placeholder { color: rgba(200,230,205,0.30); }
  .field input:focus {
    border-color: var(--border-focus);
    background: rgba(129,199,132,0.06);
    box-shadow: 0 0 0 3px rgba(129,199,132,0.10);
  }

  /* ── Validation message ── */
  .msg {
    display: none;
    font-size: 12px;
    margin-top: 4px;
    padding: 7px 12px;
    border-radius: 8px;
    font-weight: 500;
  }
  .msg.error { display: block; color: #ffcdd2; background: rgba(239,83,80,0.15); border: 1px solid rgba(239,83,80,0.25); }
  .msg.success { display: block; color: #c8e6c9; background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.25); }

  /* ── Buttons ── */
  .btn-register {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(46,125,50,0.90), rgba(27,94,32,0.80));
    border: 1px solid rgba(129,199,132,0.28);
    color: #c8e6c9;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 2px 14px rgba(46,125,50,0.25);
  }
  .btn-register:hover {
    background: linear-gradient(135deg, rgba(56,142,60,0.95), rgba(46,125,50,0.90));
    box-shadow: 0 4px 22px rgba(46,125,50,0.40);
    transform: translateY(-1px);
  }
  .btn-register:active { transform: translateY(0); }

  .btn-back {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(255,255,255,0.03);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-back:hover {
    background: rgba(129,199,132,0.08);
    border-color: rgba(129,199,132,0.30);
    color: var(--text);
  }

  /* ── Footer note ── */
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: rgba(200,230,205,0.30);
    margin-top: 20px;
    letter-spacing: 0.3px;
  }
</style>
</head>

<body>

<div class="nature-bg"></div>
<div class="leaves">
  <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
  <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
  <div class="leaf"></div>
</div>

<div class="card">
  <div class="brand">
    <div class="brand-emblem">🌿</div>
    <div class="brand-title">Tạo Tài Khoản</div>
    <div class="brand-sub">Ranger Monitor AI</div>
  </div>
  <div class="divider"></div>

  <div id="form-msg" class="msg"></div>

  <div class="field">
    <label>Tên đăng nhập</label>
    <input type="text" id="username" placeholder="ranger_name">
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="email@example.com">
  </div>
  <div class="field">
    <label>Mật khẩu</label>
    <input type="password" id="password" placeholder="Tối thiểu 6 ký tự">
  </div>
  <div class="field">
    <label>Xác nhận mật khẩu</label>
    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
  </div>

  <button class="btn-register" onclick="goRegister()">Đăng Ký</button>
  <button class="btn-back" onclick="location.href='/login'">Quay lại Đăng Nhập</button>

  <div class="footer-note">Hệ thống quan trắc sinh thái · Tê Tê & Cầy Vòi Mốc</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
import { getAuth, createUserWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCS3M9ZGf_G8ST8aZytnr0X5fVdQP1iepQ",
  authDomain: "tete-47482.firebaseapp.com",
  projectId: "tete-47482",
  storageBucket: "tete-47482.firebasestorage.app",
  messagingSenderId: "1080578060068",
  appId: "1:1080578060068:web:6ba3f600be8c938a8e4db1",
  measurementId: "G-5XYWH53TRY"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);

function showMsg(text, type) {
  const el = document.getElementById('form-msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

window.goRegister = function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!email) { showMsg("Vui lòng nhập email.", "error"); return; }
  if (password !== confirmPassword) { showMsg("Mật khẩu không khớp!", "error"); return; }
  if (password.length < 6) { showMsg("Mật khẩu phải ít nhất 6 ký tự!", "error"); return; }

  showMsg("Đang tạo tài khoản...", "success");

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      showMsg("Đăng ký thành công! Đang chuyển hướng...", "success");
      setTimeout(() => { window.location.href = "/login"; }, 1200);
    })
    .catch((error) => {
      const msgs = {
        'auth/email-already-in-use': 'Email này đã được sử dụng.',
        'auth/invalid-email':        'Địa chỉ email không hợp lệ.',
        'auth/weak-password':        'Mật khẩu quá yếu, hãy dùng ít nhất 6 ký tự.'
      };
      showMsg(msgs[error.code] || error.message, "error");
    });
};
</script>

</body>
</html>
