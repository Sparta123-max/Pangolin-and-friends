<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Ranger Monitor AI</title>
    <meta name="description" content="Đăng nhập vào hệ thống Ranger Monitor AI để truy cập dữ liệu quan trắc bảo tồn thiên nhiên." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #060e07;
        --green-300: #81c784;
        --green-500: #4caf50;
        --green-700: #2e7d32;
        --green-900: #1b5e20;
        --text: #edf7ee;
        --text-muted: #90a898;
        --border: rgba(129, 199, 132, 0.18);
        --border-focus: rgba(129, 199, 132, 0.55);
        --surface: rgba(14, 34, 17, 0.72);
        --transition: 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }

      body {
        min-height: 100vh;
        background: var(--bg);
        background-image:
          radial-gradient(ellipse 80% 60% at 10% 15%, rgba(27,94,32,0.25) 0%, transparent 55%),
          radial-gradient(ellipse 70% 55% at 90% 85%, rgba(46,125,50,0.18) 0%, transparent 50%);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      /* Ambient glow blobs */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(50px);
        z-index: 0;
        pointer-events: none;
        animation: float 14s infinite alternate ease-in-out;
      }

      .blob-1 {
        width: 360px; height: 360px;
        top: -80px; left: -80px;
        background: radial-gradient(circle, rgba(46,125,50,0.28) 0%, transparent 70%);
      }

      .blob-2 {
        width: 280px; height: 280px;
        bottom: -60px; right: -60px;
        background: radial-gradient(circle, rgba(27,94,32,0.22) 0%, transparent 70%);
        animation-delay: -7s;
      }

      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(40px, 25px) scale(1.08); }
      }

      /* Card */
      .card {
        background: rgba(10, 26, 13, 0.78);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        width: 100%;
        max-width: 420px;
        padding: 44px 38px 40px;
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow:
          0 24px 64px rgba(0,0,0,0.55),
          0 0 0 1px rgba(255,255,255,0.04),
          inset 0 1px 0 rgba(255,255,255,0.06);
        text-align: center;
        z-index: 10;
        animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }

      .card::before {
        content: '';
        position: absolute; top: 0; left: 10%; right: 10%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(129,199,132,0.45), transparent);
        border-radius: 0 0 999px 999px;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Brand mark */
      .brand-mark {
        width: 56px; height: 56px;
        background: linear-gradient(145deg, rgba(46,125,50,0.4), rgba(27,94,32,0.6));
        border: 1px solid rgba(129,199,132,0.22);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 0 24px rgba(129,199,132,0.16);
      }

      .brand-mark svg {
        width: 26px; height: 26px;
        stroke: var(--green-300); fill: none;
        stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      }

      .title {
        font-size: 22px; font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        letter-spacing: -0.3px;
      }

      .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 32px;
        line-height: 1.5;
      }

      /* Form groups */
      .form-group {
        position: relative;
        margin-bottom: 16px;
        text-align: left;
      }

      .form-group label {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--green-300);
        margin-bottom: 7px;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        opacity: 0.85;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon {
        position: absolute;
        left: 13px;
        color: var(--text-muted);
        display: flex; align-items: center;
        pointer-events: none;
        transition: color var(--transition);
      }

      .input-icon svg {
        width: 16px; height: 16px;
        stroke: currentColor; fill: none;
        stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      }

      input {
        width: 100%;
        padding: 12px 16px 12px 42px;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 11px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: all var(--transition);
        -webkit-font-smoothing: antialiased;
      }

      input::placeholder { color: rgba(143,168,152,0.55); }

      input:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(129,199,132,0.14);
        background: rgba(0,0,0,0.5);
      }

      input:focus + .input-icon { color: var(--green-300); }

      /* Password toggle */
      .toggle-password {
        position: absolute; right: 13px;
        cursor: pointer; color: var(--text-muted);
        display: flex; align-items: center;
        user-select: none;
        transition: color var(--transition);
      }

      .toggle-password:hover { color: var(--text); }

      .toggle-password svg {
        width: 16px; height: 16px;
        stroke: currentColor; fill: none;
        stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      }

      /* Buttons */
      button {
        width: 100%; padding: 13px; margin-top: 12px;
        border: none; border-radius: 12px;
        font-size: 14.5px; font-weight: 700;
        cursor: pointer;
        transition: all var(--transition);
        display: flex; align-items: center;
        justify-content: center; gap: 8px;
        font-family: inherit; letter-spacing: 0.1px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #558b2f, #33691e);
        color: #f1f8e9;
        border: 1px solid rgba(139,195,74,0.2);
        box-shadow: 0 4px 16px rgba(85,139,47,0.35);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 22px rgba(85,139,47,0.5);
      }

      .btn-primary:active { transform: translateY(0); }

      .btn-google {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text); margin-top: 10px;
      }

      .btn-google:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.18);
        transform: translateY(-1px);
      }

      /* Divider */
      .divider {
        display: flex; align-items: center;
        margin: 18px 0;
        color: rgba(143,168,152,0.5);
        font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      }

      .divider::before, .divider::after {
        content: ""; flex: 1; height: 1px;
        background: rgba(255,255,255,0.08);
      }

      .divider::before { margin-right: 12px; }
      .divider::after { margin-left: 12px; }

      /* Register prompt */
      .register-prompt {
        margin-top: 24px; font-size: 13px; color: var(--text-muted);
      }

      .register-link {
        color: var(--green-300); text-decoration: none;
        font-weight: 600; margin-left: 4px;
        transition: color var(--transition);
      }

      .register-link:hover { color: #a5d6a7; text-decoration: underline; }

      /* Toast */
      .toast {
        position: fixed;
        top: -100px; left: 50%;
        transform: translateX(-50%);
        background: rgba(183,28,28,0.95);
        color: white;
        padding: 12px 26px;
        border-radius: 12px;
        font-weight: 600; font-size: 13.5px;
        box-shadow: 0 10px 32px rgba(0,0,0,0.45);
        z-index: 10005;
        transition: top 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        display: flex; align-items: center; gap: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        white-space: nowrap;
        backdrop-filter: blur(10px);
      }

      .toast.success { background: rgba(46,125,50,0.95); }
      .toast.show { top: 28px; }

      /* Spinner */
      .spinner {
        width: 18px; height: 18px;
        border: 2px solid rgba(0,0,0,0.2);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        display: none;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="title">Ranger Monitor AI</div>
      <div class="subtitle">Hệ thống giám sát bảo tồn thiên nhiên</div>

      <div class="form-group">
        <label for="email">Tài khoản Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="example@domain.com" required />
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" required />
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <div class="toggle-password" onclick="togglePasswordVisibility()">
            <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>
      </div>

      <button class="btn-primary" onclick="login()">
        <span class="spinner" id="login-spinner"></span>
        <span id="login-text">Đăng nhập</span>
      </button>

      <div class="divider">Hoặc</div>

      <button class="btn-google" onclick="loginGoogle()">
        <!-- Google SVG Icon (official colors) -->
        <svg style="width:17px;height:17px;flex-shrink:0;" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Đăng nhập với Google
      </button>

      <div class="register-prompt">
        Chưa có tài khoản?
        <a class="register-link" href="/register">Đăng ký ngay</a>
      </div>
    </div>

    <div class="toast" id="toast">
      <span id="toast-message">Có lỗi xảy ra!</span>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB2P5IXOSxwVPz9BKka5Z_VAHwO8f_woGY",
        authDomain: "test-7a841.firebaseapp.com",
        projectId: "test-7a841",
        storageBucket: "test-7a841.appspot.com",
        messagingSenderId: "174808059664",
        appId: "1:174808059664:web:056a7e95c67a8742041f95",
        measurementId: "G-P214QPV3MY",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      function showToast(message, type = "error") {
        const toast = document.getElementById("toast");
        const msgEl = document.getElementById("toast-message");
        msgEl.textContent = message;
        toast.className = "toast";
        if (type === "success") toast.classList.add("success");
        toast.classList.add("show");
        setTimeout(() => { toast.classList.remove("show"); }, 4000);
      }

      window.togglePasswordVisibility = function () {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eye-icon");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
        } else {
          passwordInput.type = "password";
          eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }
      };

      window.login = function () {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!email || !password) {
          showToast("Vui lòng nhập đầy đủ email và mật khẩu!");
          return;
        }

        const spinner = document.getElementById("login-spinner");
        const btnText = document.getElementById("login-text");
        spinner.style.display = "inline-block";
        btnText.textContent = "Đang xác thực...";
        document.querySelector(".btn-primary").disabled = true;

        signInWithEmailAndPassword(auth, email, password)
          .then(() => {
            showToast("Đăng nhập thành công!", "success");
            setTimeout(() => { window.location.href = "/"; }, 800);
          })
          .catch((error) => {
            let msg = "Đăng nhập thất bại. Vui lòng kiểm tra lại tài khoản!";
            if (["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(error.code)) {
              msg = "Email hoặc mật khẩu không chính xác!";
            } else if (error.code === "auth/invalid-email") {
              msg = "Địa chỉ email không hợp lệ!";
            }
            showToast(msg);
            spinner.style.display = "none";
            btnText.textContent = "Đăng nhập";
            document.querySelector(".btn-primary").disabled = false;
          });
      };

      window.loginGoogle = function () {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider)
          .then(() => {
            showToast("Đăng nhập thành công!", "success");
            setTimeout(() => { window.location.href = "/"; }, 800);
          })
          .catch(() => { showToast("Đăng nhập bằng Google thất bại!"); });
      };
    </script>
  </body>
</html>
