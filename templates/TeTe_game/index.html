<!DOCTYPE html>
<html lang="vi">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>Mini Game Tê Tê - TeTe Ranger Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-deep: #030a04;
            --panel: rgba(12, 33, 16, 0.85);
            --panel-border: rgba(129, 199, 132, 0.22);
            --panel-border-hover: rgba(165, 214, 167, 0.5);
            --leaf-green: #81c784;
            --emerald: #2e7d32;
            --text-primary: #edf7ee;
            --text-muted: #8fae92;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-sans);
            margin: 0px;
            padding: 0px;
            border: 0px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Nature Ambient Background */
        .nature-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(46, 125, 50, 0.28) 0%, transparent 48%),
                radial-gradient(circle at 85% 25%, rgba(27, 94, 32, 0.32) 0%, transparent 52%),
                radial-gradient(circle at 50% 85%, rgba(13, 51, 21, 0.38) 0%, transparent 60%),
                linear-gradient(180deg, #061608 0%, #030a04 100%);
        }

        .nature-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(129, 199, 132, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.6;
        }

        /* Top Nature Navigation Bar */
        .tete-top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to right, rgba(10, 31, 14, 0.94), rgba(4, 15, 6, 0.94));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--panel-border);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .brand-name small {
            font-size: 11px;
            font-weight: 600;
            color: var(--leaf-green);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tete-btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font: 600 12.5px var(--font-sans);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .tete-btn:hover {
            transform: translateY(-1px);
            border-color: var(--panel-border-hover);
            background: rgba(129, 199, 132, 0.14);
            color: #ffffff;
        }

        .tete-btn.primary {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-color: rgba(165, 214, 167, 0.35);
        }

        /* Game Container - Compact & Centered */
        .game-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 56px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 56px);
            gap: 10px;
        }

        .game-frame {
            position: relative;
            border-radius: 16px;
            padding: 8px;
            background: linear-gradient(145deg, rgba(16, 46, 22, 0.85), rgba(8, 26, 12, 0.95));
            border: 1.5px solid rgba(129, 199, 132, 0.35);
            box-shadow:
                0 16px 48px rgba(0, 0, 0, 0.75),
                0 0 30px rgba(129, 199, 132, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 95vw;
        }

        /* GameMaker Canvas Container - Compact Size by Default */
        div.gm4html5_div_class {
            margin: 0px;
            padding: 0px;
            border: 0px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 540px;
            height: 480px;
            max-width: 92vw;
            max-height: calc(100vh - 140px);
            aspect-ratio: 720 / 640;
            transition: width 0.25s ease, height 0.25s ease;
        }

        /* Primary Canvas */
        canvas#canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            display: block;
            border-radius: 10px;
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            touch-action: none;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        }

        canvas:-webkit-full-screen,
        canvas:fullscreen {
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
        }

        /* Loading Screen - Strict Center Placement */
        canvas#loading_screen {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 10px !important;
            z-index: 25 !important;
            display: block !important;
        }

        /* HTML Pre-Loader Overlay Centered in Middle */
        .game-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 15, 7, 0.96);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 30;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .game-loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .game-loading-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3.5px solid rgba(129, 199, 132, 0.2);
            border-top-color: #81c784;
            animation: spinLoader 0.9s linear infinite;
        }

        @keyframes spinLoader {
            to { transform: rotate(360deg); }
        }

        .game-loading-title {
            font-size: 15px;
            font-weight: 700;
            color: #edf7ee;
            letter-spacing: -0.2px;
        }

        .game-loading-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Controls & Size Toolbar below Game */
        .game-controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            width: 540px;
            max-width: 92vw;
            transition: width 0.25s ease;
        }

        .game-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .screen-size-controls {
            display: flex;
            gap: 6px;
        }

        .size-btn {
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .size-btn:hover {
            background: rgba(129, 199, 132, 0.12);
            color: #ffffff;
        }

        .size-btn.active {
            background: rgba(129, 199, 132, 0.2);
            border-color: var(--leaf-green);
            color: #ffffff;
        }

        /* Runner Dialog Styles */
        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: solid 2px #000000;
            background-color: #404040;
            color: #00ff00;
            border-radius: 15px;
            box-shadow: #101010 20px 20px 40px;
        }
        div.gm4html5_cancel_button { float: right; }
        div.gm4html5_login_button { float: left; }
        div.gm4html5_login_header { text-align: center; }
    </style>
</head>

<body>
    <!-- Nature backdrop -->
    <div class="nature-bg"></div>

    <!-- Top Forest Nav -->
    <header class="tete-top-nav" aria-label="Navigation">
        <a href="/" class="brand-group">
            <div class="brand-name">
                TeTe <small>Mini Game</small>
            </div>
        </a>
        <nav class="nav-actions">
            <button class="tete-btn primary" onclick="location.href='/'">Dashboard</button>
            <button class="tete-btn" onclick="location.href='/species'">Sổ Tay Tê Tê</button>
            <button class="tete-btn" onclick="location.href='/map'">Animal Spot</button>
            <button class="tete-btn" onclick="location.href='/about'">About us</button>
            <button class="tete-btn" onclick="location.href='/visitors'">Thống kê truy cập</button>
        </nav>
    </header>

    <!-- Game Center -->
    <main class="game-wrapper">
        <div class="game-frame">
            <div class="gm4html5_div_class" id="gm4html5_div_id">
                <!-- Centered Loading Overlay (In the middle of the game screen) -->
                <div class="game-loading-overlay" id="game-loading-overlay">
                    <div class="game-loading-spinner"></div>
                    <div class="game-loading-title">Đang Tải Mini Game Tê Tê...</div>
                    <div class="game-loading-sub">Vui lòng chờ trong giây lát</div>
                </div>

                <canvas id="canvas" width="720" height="640">
                    <p>Trình duyệt của bạn không hỗ trợ HTML5 canvas.</p>
                </canvas>
            </div>
        </div>

        <!-- Controls & Screen Size Toggle Bar -->
        <div class="game-controls-bar" id="game-controls-bar">
            <div class="game-hint">Phím mũi tên / WASD: di chuyển • Phím cách: tương tác</div>
            <div class="screen-size-controls">
                <button class="size-btn active" id="btn-size-compact" onclick="setGameSize('compact')">Thu nhỏ (540×480)</button>
                <button class="size-btn" id="btn-size-medium" onclick="setGameSize('medium')">Vừa (630×560)</button>
                <button class="size-btn" id="btn-size-fullscreen" onclick="toggleGameFullscreen()">Toàn màn hình</button>
            </div>
        </div>
    </main>

    <!-- GameMaker Loading Bar & Script Injection -->
    <script>
        // Custom loading bar callback for GameMaker canvas
        window.customLoadingBar = function(ctx, width, height, total, current, image) {
            // Hide the HTML overlay when GameMaker actively renders canvas loading
            const htmlOverlay = document.getElementById('game-loading-overlay');
            if (htmlOverlay && !htmlOverlay.classList.contains('hidden')) {
                htmlOverlay.classList.add('hidden');
            }

            // Dark green forest background
            ctx.fillStyle = '#061608';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            // Title in center of screen
            ctx.fillStyle = '#81c784';
            ctx.font = 'bold 20px Inter, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Đang Tải Mini Game Tê Tê...', cx, cy - 35);

            // Subtitle
            ctx.fillStyle = '#8fae92';
            ctx.font = '12px Inter, Arial, sans-serif';
            ctx.fillText('Vui lòng chờ trong giây lát', cx, cy - 12);

            // Centered Progress Bar Track
            const barW = Math.min(300, width * 0.65);
            const barH = 10;
            const barX = cx - barW / 2;
            const barY = cy + 15;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(barX, barY, barW, barH, 5);
            else ctx.rect(barX, barY, barW, barH);
            ctx.fill();

            // Progress Fill
            const pct = total > 0 ? Math.min(1, Math.max(0, current / total)) : 0;
            const fillW = Math.max(6, barW * pct);
            ctx.fillStyle = '#43a047';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(barX, barY, fillW, barH, 5);
            else ctx.rect(barX, barY, fillW, barH);
            ctx.fill();

            // Percentage Text
            ctx.fillStyle = '#c8e6c9';
            ctx.font = '600 12px Inter, Arial, sans-serif';
            ctx.fillText(Math.round(pct * 100) + '%', cx, barY + 26);
        };

        // Pin loading screen strictly to top: 0, left: 0 to avoid GameMaker offset bugs
        const observer = new MutationObserver(() => {
            const loadEl = document.getElementById('loading_screen');
            if (loadEl) {
                loadEl.style.setProperty('position', 'absolute', 'important');
                loadEl.style.setProperty('top', '0', 'important');
                loadEl.style.setProperty('left', '0', 'important');
                loadEl.style.setProperty('width', '100%', 'important');
                loadEl.style.setProperty('height', '100%', 'important');
            }
        });
        const container = document.getElementById('gm4html5_div_id');
        if (container) {
            observer.observe(container, { childList: true, subtree: true });
        }

        // Screen size controls: Compact (540x480), Medium (630x560), Fullscreen
        function setGameSize(size) {
            const cont = document.getElementById('gm4html5_div_id');
            const bar = document.getElementById('game-controls-bar');
            const btnCompact = document.getElementById('btn-size-compact');
            const btnMedium = document.getElementById('btn-size-medium');
            if (!cont) return;

            if (size === 'compact') {
                cont.style.width = '540px';
                cont.style.height = '480px';
                if (bar) bar.style.width = '540px';
                if (btnCompact) btnCompact.classList.add('active');
                if (btnMedium) btnMedium.classList.remove('active');
            } else if (size === 'medium') {
                cont.style.width = '630px';
                cont.style.height = '560px';
                if (bar) bar.style.width = '630px';
                if (btnMedium) btnMedium.classList.add('active');
                if (btnCompact) btnCompact.classList.remove('active');
            }
        }

        function toggleGameFullscreen() {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;
            if (!document.fullscreenElement) {
                if (canvas.requestFullscreen) canvas.requestFullscreen();
                else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
                else if (canvas.msRequestFullscreen) canvas.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    </script>

    <!-- Run the game code -->
    <script type="text/javascript" src="/html5game/TeTe(8).js?cachebust=460899484"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof JSON_game !== 'undefined' && JSON_game.Options) {
                JSON_game.Options.loadingBarCallback = 'customLoadingBar';
            }

            if (typeof GameMaker_Init === 'function') {
                GameMaker_Init();
            }

            // Hide overlay once game is active
            const checkInterval = setInterval(() => {
                const loadEl = document.getElementById('loading_screen');
                const overlay = document.getElementById('game-loading-overlay');
                if (!loadEl && overlay && (window.g_pBuiltIn || window.g_CurrentGraphics)) {
                    overlay.classList.add('hidden');
                    clearInterval(checkInterval);
                }
            }, 300);

            // Fallback timeout to hide overlay
            setTimeout(() => {
                const overlay = document.getElementById('game-loading-overlay');
                if (overlay) overlay.classList.add('hidden');
                clearInterval(checkInterval);
            }, 8000);
        });
    </script>
</body>

</html>
